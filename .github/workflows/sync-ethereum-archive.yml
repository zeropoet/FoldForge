name: Synchronize Ethereum Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: foldforge-ethereum-archive-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest new and changed Ethereum works
        env:
          ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}
        run: npm run sync:eth-archive
      - name: Verify archive and application
        env:
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}
        run: |
          npm test
          npm run lint
          npm run build
      - name: Commit changed archive evidence
        id: archive-commit
        run: |
          git config user.name "foldforge-ethereum-archive[bot]"
          git config user.email "foldforge-ethereum-archive[bot]@users.noreply.github.com"
          git add public/ethereum-archive public/record-sound-archive.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Synchronize Ethereum archive"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy changed public archive
        if: steps.archive-commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
