name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CUSTOM_DOMAIN: foldforge.xyz
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wake Root Logos source integration
        env:
          ROOT_LOGOS_DISPATCH_TOKEN: ${{ secrets.ROOT_LOGOS_DISPATCH_TOKEN }}
          FOLDFORGE_REVISION: ${{ github.sha }}
        run: |
          if [ -z "$ROOT_LOGOS_DISPATCH_TOKEN" ]; then
            echo "ROOT_LOGOS_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          echo "$FOLDFORGE_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/root-logos/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ROOT_LOGOS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "{\"event_type\":\"foldforge-published\",\"client_payload\":{\"revision\":\"$FOLDFORGE_REVISION\"}}"
