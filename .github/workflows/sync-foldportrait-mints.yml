name: Synchronize FoldPortrait Mints

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: foldportrait-mint-snapshot
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mint a read-only FoldPortrait token
        id: foldportrait-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: FoldPortrait
          permission-contents: read
      - name: Check out canonical FoldPortrait catalog
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldPortrait
          path: FoldPortrait
          ref: main
          fetch-depth: 1
          token: ${{ steps.foldportrait-token.outputs.token }}
      - name: Import canonical private catalog
        run: |
          cp FoldPortrait/Mint/catalog.json /tmp/foldportrait-mints.json
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/foldportrait-mints.json")); if(value.schema!=="foldportrait-mint-catalog/v1" || value.authority!=="FoldPortrait" || value.work_count!==value.works.length) throw new Error("Invalid FoldPortrait mint catalog");'
          cp /tmp/foldportrait-mints.json public/ledger-witness/foldportrait-mints.json
      - name: Commit reviewed snapshot
        id: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ledger-witness/foldportrait-mints.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Synchronize FoldPortrait mint snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish changed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Report synchronization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Mint propagation failure / FoldForge"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The FoldPortrait mint snapshot synchronization failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
