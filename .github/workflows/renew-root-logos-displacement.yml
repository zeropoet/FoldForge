name: Renew Root Logos Displacement Map

on:
  schedule:
    - cron: "11 * * * *"
  repository_dispatch:
    types:
      - root-logos-published
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: root-logos-displacement-renewal
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FoldForge
        uses: actions/checkout@v7
        with:
          path: foldforge
          ref: main

      - name: Check out Root Logos
        uses: actions/checkout@v7
        with:
          repository: zeropoet/root-logos
          path: root-logos
          token: ${{ secrets.ROOT_LOGOS_DISPATCH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate witnessed displacement map
        id: displacement
        working-directory: foldforge
        run: |
          npm run build:displacement-map -- ../root-logos
          if git diff --quiet -- public/root-logos-living-object-displacement.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed composition
        if: steps.displacement.outputs.changed == 'true'
        working-directory: foldforge
        env:
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit renewed displacement witness
        if: steps.displacement.outputs.changed == 'true'
        working-directory: foldforge
        run: |
          git config user.name "foldforge-displacement-renewal[bot]"
          git config user.email "foldforge-displacement-renewal[bot]@users.noreply.github.com"
          git add public/root-logos-living-object-displacement.json
          git commit -m "Refresh Root Logos living displacement map"
          git push origin HEAD:main

      - name: Publish changed sound witness
        if: steps.displacement.outputs.changed == 'true'
        working-directory: foldforge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Report unchanged geometry
        if: steps.displacement.outputs.changed != 'true'
        run: echo "Root Logos Living Object displacement is unchanged; no FoldForge commit was created."
